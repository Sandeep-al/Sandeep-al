<svg xmlns="http://www.w3.org/2000/svg" width="490" height="253">
<style>
  .terminal { font-family: monospace; font-size: 14px; white-space: pre; }
  .title { fill: #c792ea; font-weight: bold; }
  .divider { fill: #89ddff; }
  .key { fill: #addb67; font-weight: bold; }
  .val { fill: #a6accd; }
</style>
<rect width="100%" height="100%" fill="transparent"/>
<text x="15" y="35" class="terminal">
  <tspan class="title">sandeep-al@github</tspan>
  <tspan x="15" dy="22" class="divider">-----------------</tspan>
  <tspan x="15" dy="22">
    <tspan class="key">Name: </tspan><tspan class="val">Sandeep Kumar</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.15s" fill="freeze" />
  </tspan>
  <tspan x="15" dy="22">
    <tspan class="key">OS: </tspan><tspan class="val">IIIT Delhi Undergraduate</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.3s" fill="freeze" />
  </tspan>
  <tspan x="15" dy="22">
    <tspan class="key">Focus: </tspan><tspan class="val">DSA, Backend Development, Systems Programming</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.44999999999999996s" fill="freeze" />
  </tspan>
  <tspan x="15" dy="22">
    <tspan class="key">Languages: </tspan><tspan class="val">C, C++, Java, Python, JavaScript</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.6s" fill="freeze" />
  </tspan>
  <tspan x="15" dy="22">
    <tspan class="key">Web Dev: </tspan><tspan class="val">HTML5, CSS3, Node.js</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.75s" fill="freeze" />
  </tspan>
  <tspan x="15" dy="22">
    <tspan class="key">Tools: </tspan><tspan class="val">Git, GitHub, Java Swing</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.8999999999999999s" fill="freeze" />
  </tspan>
  <tspan x="15" dy="22">
    <tspan class="key">Profiles: </tspan><tspan class="val">LeetCode (asym_ptotic)</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.05s" fill="freeze" />
  </tspan>
</text>
</svg>